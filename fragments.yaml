fragments:
    - title: AIBOX 指令过滤
      content: 'lnav -c ":filter-in AiosGrpcClientImpl" -c ":filter-in R4Arbiter" -c ":filter-in ProtocolConverterManager"   -c  ":filter-in SemanticDispatcher:"  -c ":filter-in playTTsFullParams"    -q '
      tags:
        - Lanv
        - AIBOX
    - title: AI-BOX Agent
      content: lnav -c ":filter-in SseAgentBridge" -c ":filter-in SseCarCommandProcessor" -c ":filter-in CarManualStreamAgentVM" -c ":filter-in TinnoveIpc"  -c ":filter-in CarManualStreamAgentScene" -c ":filter-in SseAgentStreamRouter"  -c ":filter-in R4Arbiter" -q
      tags:
        - Lanv
        - AIBOX
    - title: Rg 过滤 ASR 所在文件
      content: ' rg -lz "getAsrText: 打开座椅通风"'
      tags:
        - Rg
    - title: 端状态
      content: ' rg -z -M 500 --max-columns-preview "uploadContextState appId:1A7BB7ACC7AC6B8B8158C16853C8F77D"'
      tags:
        - Rg
    - title: 查找指定文本
      content: rg -z -M 200 --max-columns-preview "车里好热啊"
      tags:
        - Rg
    - title: 全时免唤醒
      content: |-
        adb shell settings put global tinnove_wakeup_switch  1
        adb shell settings put global tinnove_fulltime_wakeup_switch 1
        adb shell settings put global tinnove_continuous_conversation_duration 1
        adb shell am force-stop com.baidu.che.codriver
      tags:
        - adb
    - title: 任务大师环境日志
      content: CUISkillHandler
      tags:
        - Log
    - title: 中间识别结果
      content: name:asr.partial
      tags:
        - Log
    - title: 常用链路查看
      content: 'lnav -c ":filter-in initService"  -c  ":filter-in SemanticDispatcher:"  -c ":filter-in playTTsFullParams"    -q '
      tags:
        - Lanv
