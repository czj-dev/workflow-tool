id: xdzs-debug-chain
title: 调试一键链
icon: hi:flash
description: "设备初始化 → 编译 Debug → 安装 APK → 拉起测试页面"
steps:
  - id: device-init
    name: 设备初始化
    action: xdzs-device-init
  - id: build
    name: 编译 Debug
    action: xdzs-build-app
    params: { VARIANT: Debug }
  - id: find-apk
    name: 定位 APK
    run: |
      APK=$(find "${VOICE_DEBUG_OUTPUT}" -maxdepth 1 -name "*.apk" | head -1)
      if [ -z "$APK" ]; then echo "未找到 APK: ${VOICE_DEBUG_OUTPUT}"; exit 1; fi
      echo "定位 APK: $APK"
      echo "##[output apk_path=$APK]"
  - id: install
    name: 安装 APK
    action: adb-install
    params:
      APK_PATH: "${{ steps.find-apk.outputs.apk_path }}"
      ALLOW_TEST: "true"
      ALLOW_DOWNGRADE: "true"
  - id: wait
    name: 等待安装落地
    sleep: 10
  - id: launch
    name: 拉起测试页面
    action: adb-debug-activity
