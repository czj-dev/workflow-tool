id: xdzs-debug-chain
title: 调试一键链
icon: hi:flash
description: "设备初始化 → 编译 Debug → 安装 APK → 拉起测试页面"
steps:
  - id: device-init
    name: 设备初始化
    action: xdzs-device-init
  - id: build
    name: 编译 Debug
    action: xdzs-build-app
    params: { VARIANT: Debug }
  - id: install
    name: 安装 APK
    action: adb-install
  - id: launch
    name: 拉起测试页面
    action: adb-debug-activity
