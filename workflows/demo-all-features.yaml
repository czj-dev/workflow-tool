id: demo-all-features
title: "演示: 全功能工作流"
icon: hi:workflow
description: "覆盖 workflow 全部能力：params 四类型、action/sleep/shell 三形态、env、if 条件与 outputs 引用、SKIPPED、retry、continue_on_error"

env:
  GREETING: hello

params:
  - id: WF_MSG
    label: 消息
    type: text
    default: hello
    required: true
  - id: WF_MODE
    label: 模式
    type: select
    default: fast
    options:
      - fast
      - slow
  - id: WF_VERBOSE
    label: 详细日志
    type: bool
    default: "true"
  - id: WF_OUTDIR
    label: 输出目录
    type: path
    default: ""

steps:
  # 1. shell 形态：回显参数 —— 验证 params 四类型注入 + 普通 stdout
  - id: echo-params
    name: 回显参数
    shell: echo "msg=${WF_MSG} mode=${WF_MODE} verbose=${WF_VERBOSE} out=${WF_OUTDIR}"

  # 2. sleep 形态：等待 —— 验证等待态展示
  - id: wait
    name: 等待 2s
    sleep: 2

  # 3. action 形态：引用已有动作 —— 验证 step.params 覆盖 action 参数
  - id: call-action
    name: 调用动作
    action: demo-echo
    params: { MSG: "来自 workflow 的问候" }

  # 4. shell 形态：写 outputs 协议行 —— 验证 ##[output] 自定义 key
  - id: produce
    name: 生产数据
    shell: |
      echo "开始执行..."
      echo "##[output build_id=42]"
      echo "完成"

  # 5. if 条件为真 —— 验证 outputs 引用 + ${{ }} 拼接 + env 引用
  - id: consume
    name: 消费数据（条件满足）
    if: steps.produce.outputs.exit_code == '0'
    shell: echo "build_id=${{ steps.produce.outputs.build_id }}, greeting=${GREETING}"

  # 6. if 条件为假 —— 验证 SKIPPED 状态
  - id: skip-this
    name: 条件跳过演示
    if: steps.produce.outputs.exit_code == '99'
    shell: echo "这行不会被执行"

  # 7. retry 演示：命令必然失败，验证重试痕迹（retry 1/2、retry 2/2）+ continue_on_error 不中断后续
  - id: retry-demo
    name: 重试演示（必然失败）
    shell: exit 1
    retry: 2
    continue_on_error: true

  # 8. 故意失败（stderr + 非零退出，且不 continue_on_error）—— 验证 error 态 + stderr 分层，作为整条 workflow 的终止点
  # PowerShell: Write-Error 写 stderr；exit 1 让退出码非 0
  - id: fail-demo
    name: 演示失败
    shell: Write-Error "演示失败：这是一条 stderr 输出"; exit 1
