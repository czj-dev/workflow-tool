id: xdzs-package-and-verify-res
title: 资源打包并验证
icon: hi:package
description: "打包语音项目资源 → push 到设备 backup 目录 → chmod 777 验证"
params:
  - id: PROJECT_DIR
    label: xdzs-resource 项目目录
    type: path
    required: true
    default: /Users/v_chenzhaojun/Project/baidu/asd-edc/xdzs-resource
  - id: RES_NAME
    label: 产品线资源目录名
    type: select
    required: true
    default: C518-1
    options:
      - C518-1
      - B216-C
steps:
  - id: device-init
    name: 设备初始化
    action: xdzs-device-init
  - id: packag
    name: 打包资源
    run: |
      RES_DIR="${PROJECT_DIR}/resource/${RES_NAME}"
      if [ ! -d "$RES_DIR" ]; then
        echo "资源目录不存在: $RES_DIR" >&2; exit 1
      fi
      if [ ! -x "${PROJECT_DIR}/scripts/package_speech_res.sh" ]; then
        echo "未找到打包脚本: ${PROJECT_DIR}/scripts/package_speech_res.sh" >&2; exit 1
      fi
      cd "${PROJECT_DIR}"
      ./scripts/package_speech_res.sh "$RES_DIR"
    timeout: 240s
  - id: clean-loaded-res
    name: 清理设备旧资源
    # 删除 app 解压加载后的资源目录，绕过 SotaSpeechResourceLoader 的
    # version 相同 + sotaDataCopyfinish 跳过逻辑，强制重新加载新 push 的包
    action: adb-delete-file
    params:
      REMOTE_PATH: /resources/appdata/tinnove/WT_TSpeech
      ALLOW_PROTECTED: "true"
  - id: push
    name: push 资源包并授权
    # 复用 res 项目自带脚本：内部做 mkdir backup + adb push + chmod -R 777 + force-stop codriver，
    # 并按 resource/<车型>/buick-xd-tinnove/speech_project_res.zip 定位包，车型即 RES_NAME
    run: |
      PUSH_SH="${PROJECT_DIR}/push_speech_res_to_device.sh"
      if [ ! -x "$PUSH_SH" ]; then
        echo "未找到 push 脚本: $PUSH_SH" >&2; exit 1
      fi
      "$PUSH_SH" "${RES_NAME}"
    timeout: 10m
