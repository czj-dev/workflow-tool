id: xdzs-package-and-verify-res
title: 资源打包并验证
icon: hi:package
description: "打包语音项目资源 → push 到设备 backup 目录 → chmod 777 验证"
params:
  - id: PROJECT_DIR
    label: xdzs-resource 项目目录
    type: path
    required: true
    default: /Users/v_chenzhaojun/Project/baidu/asd-edc/xdzs-resource
  - id: RES_NAME
    label: 产品线资源目录名
    type: select
    required: true
    default: buick-xd-tinnove
    options:
      - buick-xd-tinnove
steps:
  - id: device-init
    name: 设备初始化
    action: xdzs-device-init
  - id: packag
    name: 打包资源
    run: |
      RES_DIR="${PROJECT_DIR}/resource/${RES_NAME}"
      if [ ! -d "$RES_DIR" ]; then
        echo "资源目录不存在: $RES_DIR" >&2; exit 1
      fi
      if [ ! -x "${PROJECT_DIR}/scripts/package_speech_res.sh" ]; then
        echo "未找到打包脚本: ${PROJECT_DIR}/scripts/package_speech_res.sh" >&2; exit 1
      fi
      cd "${PROJECT_DIR}"
      ./scripts/package_speech_res.sh "$RES_DIR"
    timeout: 240s
  - id: mkdir-remote
    name: 创建设备目录
    run: adb shell mkdir -p /resources/sota/speech/backup/
  - id: push
    name: push 资源包
    action: adb-push
    params:
      LOCAL_PATH: ${PROJECT_DIR}/resource/${RES_NAME}/speech_project_res.zip
      REMOTE_PATH: /resources/sota/speech/backup/
      ALLOW_PROTECTED: "true"
  - id: chmod
    name: 授权 777
    run: adb shell chmod -R 777 /resources/sota/speech
