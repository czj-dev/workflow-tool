id: claude-ask
title: 问 Claude
icon: hi:ai
description: 输入问题，Claude（claude -p）流式回答，专用 LLM 视图渲染 markdown
params:
  - id: QUESTION
    label: 问题
    type: text
    required: true
presets:
  - name: 打招呼
    values: { QUESTION: 用一句话介绍你自己 }
command:
  shell: claude -p "${QUESTION}" --output-format=stream-json --verbose --thinking enabled
  stream: llm
  timeout: 5m
