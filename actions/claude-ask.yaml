id: claude-ask
title: 问 LLM
icon: hi:ai
description: 输入问题，LLM 流式回答；CLI 由 config.yaml LLM_CLI 决定，默认 ducc
params:
  - id: QUESTION
    label: 问题
    type: textarea
    required: true
  - id: SESSION_ID
    label: 续接会话 ID（可选）
    type: text
presets:
  - name: 打招呼
    values: { QUESTION: 用一句话介绍你自己 }
command:
  llm:
    prompt: QUESTION
    resume: SESSION_ID
  timeout: 5m
