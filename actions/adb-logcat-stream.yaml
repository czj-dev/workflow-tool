id: adb-logcat-stream
title: 实时日志
icon: hi:file
description: 实时流式 logcat（threadtime 结构化解析，按 Package/Level/Tag/关键字 过滤，手动停止）
params:
  - id: PACKAGE
    label: 包名过滤（如 com.example.app，可空）
    type: text
  - id: LEVEL
    label: 最低 Level（V/D/I/W/E/F，可空）
    type: text
    default: V
  - id: TAG
    label: Tag 过滤（多个空格分隔，可空）
    type: text
  - id: INCLUDE
    label: 消息包含（可空）
    type: text
  - id: EXCLUDE
    label: 消息排除（可空）
    type: text
  - id: FILTER
    label: 规则 JSON（可空）
    type: textarea
    description: 甲板「存为预设」写入的完整规则（含正则/取反/∨ 分组/pid，上面五个字段表达不了）。非空时整体生效并忽略上方字段；清空则回落到上方字段。
command:
  adb:
    operation: logcat-stream
  stream: logcat # 结构化 JSON 下发，前端 logcat 视图渲染
  timeout: 24h
  capture_output: false # 流式持续输出，禁止内存累积
presets:
  - name: 云端响应
    values: {EXCLUDE: "", INCLUDE: "", LEVEL: V, PACKAGE: com.baidu.che.codriver, TAG: DVR_InitService DVR_TinnoveIpc}
  - name: 对话改写
    values: {FILTER: '{"tokens":[{"key":"tag","op":"contains","negated":false,"value":"DVR_CarControlOpenBot"},{"key":"tag","op":"contains","negated":false,"value":"DVR_WtNluBot"},{"key":"tag","op":"contains","negated":false,"value":"DVR_MultiRoundRuleRegistrar"},{"key":"tag","op":"contains","negated":false,"value":"DVR_InitService"}],"minLevel":"V","package":""}', LEVEL: V, TAG: DVR_CarControlOpenBot DVR_WtNluBot DVR_MultiRoundRuleRegistrar DVR_InitService}
  - name: 指令分发
    values: {FILTER: '{"tokens":[{"key":"tag","op":"contains","negated":false,"value":"DVR_InitService","link":"or"},{"key":"message","op":"contains","negated":false,"value":"name\":\"Nlu"},{"key":"tag","op":"exact","negated":false,"value":"DVR_WtNluBot","link":"or"},{"key":"message","op":"regex","negated":false,"value":"handleNluResultByCarType"},{"key":"tag","op":"regex","negated":false,"value":"DVR_TinnoveIpc","link":"or"}],"minLevel":"V","package":""}', INCLUDE: 'name":"Nlu', LEVEL: V}
