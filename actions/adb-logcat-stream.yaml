id: adb-logcat-stream
title: 实时日志
icon: hi:file
description: 实时流式 logcat（threadtime 结构化解析，按 Level/Tag/关键字 过滤，手动停止）
params:
  - id: LEVEL
    label: 最低 Level（V/D/I/W/E/F，可空）
    type: text
    default: V
  - id: TAG
    label: Tag 过滤（多个空格分隔，可空）
    type: text
  - id: INCLUDE
    label: 消息包含（可空）
    type: text
  - id: EXCLUDE
    label: 消息排除（可空）
    type: text
command:
  adb:
    operation: logcat-stream
  timeout: 24h
  capture_output: false          # 流式持续输出，禁止内存累积
