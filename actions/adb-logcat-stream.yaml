id: adb-logcat-stream
title: 实时日志
icon: hi:file
description: 实时流式 logcat（threadtime 结构化解析，按 Package/Level/Tag/关键字 过滤，手动停止）
params:
  - id: PACKAGE
    label: 包名过滤（如 com.example.app，可空）
    type: text
  - id: LEVEL
    label: 最低 Level（V/D/I/W/E/F，可空）
    type: text
    default: V
  - id: TAG
    label: Tag 过滤（多个空格分隔，可空）
    type: text
  - id: INCLUDE
    label: 消息包含（可空）
    type: text
  - id: EXCLUDE
    label: 消息排除（可空）
    type: text
  - id: FILTER
    label: 规则 JSON（可空）
    type: textarea
    description: 甲板「存为预设」写入的完整规则（含正则/取反/∨ 分组/pid，上面五个字段表达不了）。非空时整体生效并忽略上方字段；清空则回落到上方字段。
command:
  adb:
    operation: logcat-stream
  stream: logcat # 结构化 JSON 下发，前端 logcat 视图渲染
  timeout: 24h
  capture_output: false # 流式持续输出，禁止内存累积
presets:
  - name: 指令下发
    description: 指令主链——InitService 仅保留 >==>> 指令行，WtNluBot/MixNlu/TinnoveIpc/SemanticDispatcher 全量；PACKAGE 留空以覆盖跨进程 TAG
    values: {EXCLUDE: "", INCLUDE: "", LEVEL: V, PACKAGE: "", TAG: "DVR_InitService DVR_WtNluBot DVR_MixNluArbiterImpl DVR_TinnoveIpc DVR_SemanticDispatcher", FILTER: '{"tokens":[{"key":"tag","op":"contains","negated":false,"value":"DVR_InitService"},{"key":"message","op":"contains","negated":false,"value":">==>>"},{"key":"tag","op":"contains","negated":false,"value":"DVR_WtNluBot","link":"or"},{"key":"tag","op":"contains","negated":false,"value":"DVR_MixNluArbiterImpl","link":"or"},{"key":"tag","op":"contains","negated":false,"value":"DVR_TinnoveIpc","link":"or"},{"key":"tag","op":"contains","negated":false,"value":"DVR_SemanticDispatcher","link":"or"}],"minLevel":"V","package":""}'}
  - name: AI BOX
    description: AI BOX 仲裁链（R4 四件套 + 最终指令下发 TinnoveIpc）
    values: {EXCLUDE: "", INCLUDE: "", LEVEL: V, PACKAGE: "", TAG: "DVR_R4Arbiter DVR_R4ArbiterState DVR_R4SequentialSender DVR_MixNluArbiterImpl DVR_TinnoveIpc"}
  - name: 手车互联
    description: 手车互联（PhoneLink 仲裁/路由/兜底 + 最终指令下发）
    values: {EXCLUDE: "", INCLUDE: "", LEVEL: V, PACKAGE: "", TAG: "DVR_PhoneLinkArb DVR_ThirdAppAgentDeviceModule DVR_PhoneLinkFallbackContextProvider DVR_TinnoveIpc"}
  - name: 多轮对话
    description: 多轮改写链（注册 MultiRoundRuleRegistrar → 派发 WtNluBot → DST 改写 NluModifyDeduceUnit → 转换 ProtocolConverterManager）
    values: {EXCLUDE: "", INCLUDE: "", LEVEL: V, PACKAGE: "", TAG: "DVR_MultiRoundRuleRegistrar DVR_WtNluBot DVR_NluModifyDeduceUnit DVR_ProtocolConverterManager"}
  - name: 用车 Agent
    description: 用车 Agent（SSE 投递 + TopQuery 入口拦截 + ComplexTask 主链路）
    values: {EXCLUDE: "", INCLUDE: "", LEVEL: V, PACKAGE: "", TAG: "DVR_SseAgentStreamRouter DVR_SseAgentBridge DVR_TopQueryInterceptor DVR_TopQueryInjection DVR_TopQueryUtil ernie_ComplexTaskDeviceModule ernie_CarManualStreamAgentVM"}