id: log-spm-download
title: SPM 下载 zip 内文件
icon: hi:download
description: 从 SPM 数据平台的 zip 包中按路径片段匹配文件并保存到本地（命中多个则全部下载，无需认证）
params:
  - id: ZIP_NAME
    label: zip 文件名
    type: text
    required: true
    description: 如 log_1787193057533_LS6ANE0P7TK525767.zip
  - id: INNER_PATH
    label: zip 内路径片段
    type: text
    default: resources/debuglogger/mobilelog/
    description: 精确路径优先，否则按子串匹配（大小写不敏感），命中多个则全部下载；留空 = 浏览模式，列出 zip 内全部条目树，复制目标路径回填重跑即可
  - id: OUT_DIR
    label: 输出目录
    type: path
    default: ${LOGS_DIR}
    description: 文件落在 <输出目录>/<zip名>/<zip内相对路径>；留空则保存到应用当前工作目录
command:
  script: ./scripts/spm-download.py
  timeout: 60m
