id: adb-pull
title: 拉取文件
icon: hi:download
description: 从设备拉取文件到本地（进度推送、3 次重试、可取消）
params:
  - id: REMOTE_PATH
    label: 设备路径
    type: text
    required: true
    default: /sdcard/
  - id: LOCAL_PATH
    label: 本地目录
    type: path
    required: true
command:
  adb:
    operation: pull
  timeout: 10m
presets:
  - name: 抓取日志
    description: 深蓝全日志抓入
    values: {LOCAL_PATH: /Users/v_chenzhaojun/Documents/Logs, REMOTE_PATH: resources/debuglogger/mobilelog}
  - name: 抓取日志-ALL
    description: 包括 AI BOX 等应用的日志
    values: {LOCAL_PATH: /Users/v_chenzhaojun/Documents/Logs, REMOTE_PATH: resources/debuglogger/}
