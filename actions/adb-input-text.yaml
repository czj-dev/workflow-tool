id: adb-input-text
title: 输入文本
icon: hi:text
description: 向设备输入文本；纯英文走 input text，含中文等非 ASCII 自动经剪贴板粘贴（需 Android 10+，个别 App 可能不响应粘贴）
params:
  - id: TEXT
    label: 文本
    type: text
    required: true
  - id: RESTORE_CLIPBOARD
    label: 输入后恢复设备剪贴板
    type: bool
command:
  adb:
    operation: input-text
  timeout: 30s
