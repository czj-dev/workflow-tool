id: adb-input-text
title: 输入文本
icon: hi:text
description: 向设备输入文本；纯英文走 input text，含中文等非 ASCII 经 ADBKeyboard 输入法广播（未安装自动安装内嵌 APK）
params:
  - id: TEXT
    label: 文本
    type: text
    required: true
  - id: KEEP_IME
    label: 输入后保持 ADBKeyboard 输入法（默认自动恢复原输入法）
    type: bool
command:
  adb:
    operation: input-text
  timeout: 30s
