id: adb-screenshot
title: 截屏
icon: hi:camera
description: 截取设备屏幕并保存为本地 PNG（adb exec-out screencap -p）
params:
  - id: OUTPUT_PATH
    label: 保存路径（含文件名 .png）
    type: path
    required: true
    default: ${OUTPUT_DIR}/${CURRENT_TIME}.png
  - id: DISPLAY_ID
    label: Display ID（多屏设备指定，留空用默认屏）
    type: text
    required: false
command:
  adb:
    operation: screenshot
  timeout: 30s
