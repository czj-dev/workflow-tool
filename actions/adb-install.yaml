id: adb-install
title: 安装 APK
icon: hi:package
description: adb install 安装指定 APK 到激活设备（-r 覆盖安装，可选 -t 测试包 / -d 降级）
params:
  - id: APK_PATH
    label: APK 文件
    type: file
    required: true
  - id: ALLOW_TEST
    label: 允许测试包（-t）
    type: bool
    default: "false"
  - id: ALLOW_DOWNGRADE
    label: 允许降级（-d）
    type: bool
    default: "false"
command:
  adb:
    operation: install-package
  timeout: 5m
presets:
  - name: 语音
    values: {ALLOW_DOWNGRADE: "true", ALLOW_TEST: "true", APK_PATH: /Users/v_chenzhaojun/Documents/Project/baidu/asd-edc/xdzs-speech/app-vui/vr-app/build/outputs/apk/debug/DuerOSAutoVr_debug_7.7.0.2026_0817_2020.apk}
