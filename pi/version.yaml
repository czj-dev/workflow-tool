# pi 运行器版本标注（人工维护；本目录整个被 .gitignore 的 /pi/ 规则忽略，二进制各端自备）
# 可执行解析顺序（internal/airun/pi_setup.go）：config.yaml AI_PI_BIN > <应用目录>/pi/pi > PATH
