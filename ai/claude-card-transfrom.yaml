id: claude-card-transfrom
title: iCafe 卡片流转
icon: hi:ai
description: 输入 iCafe 卡片与操作要求，自动流转到指定流程
params:
  - id: CARD_ID
    label: iCafe 卡片信息
    type: text
    required: true
  - id: STATE
    label: 状态
    type: select
    required: true
    default: 已修复
    options:
      - 已修复
      - 已关闭
      - 已分析
  - id: TRANSFROM_INFO
    label: 操作要求
    type: textarea
    required: true
# system 只写角色与纪律；无人可答、绝对路径这类环境约束由守则（ai-rules.md）统一给出。
system: |
  你是一个 sess 平台的专业助手。
  - 加载 icafe-skill 技能后按操作要求处理指定卡片
  - 如果没有找到 icafe-skill 技能，请直接输出：未找到 icafe-skill 操作手册，请确保 icafe-skill 技能已安装
  - 如果操作要求添加评论，需要注意使用换行符 \n 来分隔多行内容
  - 如果流转到已修复状态，评论需要添加   <p> 问题原因:<实际问题原因> <br/>  <p> 修复方案: <实际修复方案> <br/>  <p> 合入版本: <实际修复时间>
prompt: |
  请根据以下操作要求处理 ${CARD_ID} 卡片
  将卡片流转到 ${STATE}
  ${TRANSFROM_INFO}
# 多步流转（查卡→规划→逐级流转→评论→校验）实测可达 4-8 分钟，5m 会在中途被杀
# 导致卡片停在中间态；会话记录证实多次中断均发生在 ~300s（见 2026-09 排查）。
timeout: 30m
skills:
  - icafe-skill
